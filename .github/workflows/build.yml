name: Build Lloyd AC app
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate project files
        run: |
          cat > settings.gradle.kts << 'FILE_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "LloydAC"
          include(":app")
          FILE_EOF
          cat > build.gradle.kts << 'FILE_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          FILE_EOF
          cat > gradle.properties << 'FILE_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          FILE_EOF
          mkdir -p app
          cat > app/build.gradle.kts << 'FILE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.acremote"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.acremote"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.appcompat:appcompat:1.6.1") }
          FILE_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'FILE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.consumerir" android:required="true" />
              <application
                  android:label="Lloyd AC"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FILE_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml << 'FILE_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1E88E5" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="6"
                  android:pathData="M54,22L54,86M26,38L82,70M26,70L82,38"/>
          </vector>
          FILE_EOF
          mkdir -p app/src/main/java/com/example/acremote
          cat > app/src/main/java/com/example/acremote/MainActivity.kt << 'FILE_EOF'
          package com.example.acremote

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.hardware.ConsumerIrManager
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Gravity
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** Coolix protocol (Midea RG57-style remotes, used by Lloyd/Havells). */
          object Coolix {
              const val OFF = 0xB27BE0
              const val SWING = 0xB26BE0
              const val TURBO = 0xB5F5A2
              const val SLEEP = 0xB5F5A3
              const val LED = 0xB5F5A5

              // Temp 17..30 -> 4-bit code (Gray-code style table)
              private val TEMP = intArrayOf(0, 1, 3, 2, 6, 7, 5, 4, 12, 13, 9, 8, 10, 11)
              val MODES = listOf("Cool" to 0, "Dry" to 1, "Auto" to 2, "Heat" to 3)
              val FANS = listOf("Auto" to 5, "Low" to 4, "Med" to 2, "High" to 1)

              fun state(temp: Int, mode: Int, fan: Int): Int {
                  val b0 = 0xB2
                  val b1 = (fan shl 5) or 0x1F
                  val b2 = (TEMP[temp.coerceIn(17, 30) - 17] shl 4) or (mode shl 2)
                  return (b0 shl 16) or (b1 shl 8) or b2
              }

              /** 24-bit code -> mark/space pattern in microseconds (frame sent twice). */
              fun pattern(code: Int): IntArray {
                  val bytes = listOf((code shr 16) and 0xFF, (code shr 8) and 0xFF, code and 0xFF)
                  val p = ArrayList<Int>()
                  repeat(2) {
                      p += 4480; p += 4480
                      for (b in bytes) for (v in intArrayOf(b, b.inv() and 0xFF)) {
                          for (i in 7 downTo 0) {
                              p += 560
                              p += if ((v shr i) and 1 == 1) 1680 else 560
                          }
                      }
                      p += 560; p += 5040
                  }
                  return p.toIntArray()
              }
          }

          class MainActivity : AppCompatActivity() {
              private lateinit var ir: ConsumerIrManager
              private lateinit var vib: Vibrator
              private val prefs by lazy { getSharedPreferences("ac", Context.MODE_PRIVATE) }

              private var on = false
              private var temp = 24
              private var mode = 0   // index into Coolix.MODES
              private var fan = 0    // index into Coolix.FANS

              private lateinit var lcd: LinearLayout
              private lateinit var tvMode: TextView
              private lateinit var tvTemp: TextView
              private lateinit var tvFan: TextView
              private lateinit var tvTx: TextView
              private lateinit var tvStatus: TextView
              private lateinit var tvLog: TextView
              private val log = mutableListOf<String>()

              private val modeText = listOf("COOL ❄", "DRY", "AUTO", "HEAT ☀")
              private val fanText = listOf("AUTO", "▂", "▂▄", "▂▄▆")
              private val ink = Color.parseColor("#22251F")
              private val dark = Color.parseColor("#3A3A3A")

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun bg(color: Int, r: Int) = GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dp(r).toFloat()
              }

              private fun row() = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
              private fun col() = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

              private fun lp(w: Int, h: Int, wt: Float = 0f) =
                  LinearLayout.LayoutParams(w, h, wt).apply { setMargins(dp(6), dp(6), dp(6), dp(6)) }

              private fun key(label: String, color: Int, enabled: Boolean = true, onClick: () -> Unit): TextView =
                  TextView(this).apply {
                      text = label
                      gravity = Gravity.CENTER
                      textSize = 13f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(dark)
                      background = bg(color, 12)
                      alpha = if (enabled) 1f else 0.45f
                      isClickable = true
                      setOnClickListener {
                          if (enabled) onClick() else flash("$label: not supported by this app")
                      }
                  }

              private fun half(label: String, onClick: () -> Unit): TextView =
                  TextView(this).apply {
                      text = label
                      gravity = Gravity.CENTER
                      textSize = 20f
                      setTextColor(dark)
                      isClickable = true
                      setOnClickListener { onClick() }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  ir = getSystemService(Context.CONSUMER_IR_SERVICE) as ConsumerIrManager
                  vib = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  on = prefs.getBoolean("on", false)
                  temp = prefs.getInt("temp", 24).coerceIn(17, 30)
                  mode = prefs.getInt("mode", 0).coerceIn(0, 3)
                  fan = prefs.getInt("fan", 0).coerceIn(0, 3)

                  val root = col().apply { setPadding(dp(14), dp(40), dp(14), dp(24)) }

                  // ---- status panel ----
                  tvStatus = TextView(this).apply {
                      setTextColor(Color.WHITE); textSize = 15f; setTypeface(null, Typeface.BOLD)
                  }
                  tvLog = TextView(this).apply {
                      setTextColor(Color.parseColor("#AAAAAA")); textSize = 12f
                      setPadding(0, dp(6), 0, 0)
                  }
                  val note = TextView(this).apply {
                      text = "IR is one-way: \"Sent\" means the phone transmitted. The AC's beep confirms it received it."
                      setTextColor(Color.parseColor("#888888")); textSize = 11f
                      setPadding(0, dp(6), 0, 0)
                  }
                  val panel = col().apply {
                      background = bg(Color.parseColor("#2A2A2A"), 14)
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      addView(tvStatus); addView(tvLog); addView(note)
                  }
                  root.addView(panel, LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = dp(14) })

                  // ---- LCD ----
                  tvMode = TextView(this).apply {
                      textSize = 18f; setTypeface(null, Typeface.BOLD); setTextColor(ink)
                  }
                  tvTx = TextView(this).apply {
                      text = "((•)) SENT"; textSize = 11f; setTextColor(ink); visibility = View.INVISIBLE
                  }
                  val top = row().apply {
                      addView(tvMode, LinearLayout.LayoutParams(0, -2, 1f))
                      addView(tvTx)
                  }
                  val setLbl = TextView(this).apply {
                      text = "SET TEMP"; textSize = 10f; setTextColor(ink); gravity = Gravity.END
                  }
                  tvTemp = TextView(this).apply {
                      textSize = 76f; typeface = Typeface.MONOSPACE; setTypeface(typeface, Typeface.BOLD)
                      setTextColor(ink); gravity = Gravity.CENTER
                  }
                  tvFan = TextView(this).apply {
                      textSize = 16f; setTypeface(null, Typeface.BOLD); setTextColor(ink)
                  }
                  lcd = col().apply {
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#B4B8AB"))
                          cornerRadius = dp(8).toFloat()
                          setStroke(dp(2), Color.parseColor("#6E7168"))
                      }
                      setPadding(dp(14), dp(10), dp(14), dp(10))
                      addView(top); addView(setLbl); addView(tvTemp); addView(tvFan)
                  }

                  // ---- remote body ----
                  val gray = Color.parseColor("#A9A79F")
                  val tan = Color.parseColor("#E3B877")
                  val green = Color.parseColor("#72B36B")
                  val body = col().apply {
                      background = bg(Color.parseColor("#F1E9D2"), 30)
                      setPadding(dp(14), dp(18), dp(14), dp(18))
                  }
                  body.addView(lcd, LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = dp(10) })

                  val r1 = row()
                  r1.addView(key("ON/OFF", tan) { togglePower() }, lp(0, dp(52), 1f))
                  r1.addView(key("ECO", green, false) {}, lp(0, dp(52), 1f))
                  body.addView(r1)

                  val mid = row().apply { gravity = Gravity.CENTER_VERTICAL }
                  val left = col()
                  left.addView(key("MODE", gray) { cycleMode() }, lp(-1, dp(56)))
                  left.addView(key("FAN", gray) { cycleFan() }, lp(-1, dp(56)))
                  val right = col()
                  right.addView(key("TIMER ON", gray, false) {}, lp(-1, dp(56)))
                  right.addView(key("TIMER OFF", gray, false) {}, lp(-1, dp(56)))
                  val rocker = col().apply { background = bg(gray, 16) }
                  rocker.addView(half("▲") { tempStep(1) }, LinearLayout.LayoutParams(-1, 0, 1f))
                  rocker.addView(TextView(this).apply {
                      text = "TEMP"; textSize = 12f; gravity = Gravity.CENTER; setTextColor(dark)
                  }, LinearLayout.LayoutParams(-1, -2))
                  rocker.addView(half("▼") { tempStep(-1) }, LinearLayout.LayoutParams(-1, 0, 1f))
                  mid.addView(left, LinearLayout.LayoutParams(0, -2, 1f))
                  mid.addView(rocker, lp(0, dp(124), 1f))
                  mid.addView(right, LinearLayout.LayoutParams(0, -2, 1f))
                  body.addView(mid)

                  val r4 = row()
                  val swingBox = row().apply { background = bg(gray, 12) }
                  swingBox.addView(half("↕") { swing() }, LinearLayout.LayoutParams(0, -1, 1f))
                  val hSwing = half("↔") { flash("Horizontal swing: not supported by this app") }
                  hSwing.alpha = 0.45f
                  swingBox.addView(hSwing, LinearLayout.LayoutParams(0, -1, 1f))
                  r4.addView(key("SLEEP", gray) { sleepMode() }, lp(0, dp(48), 1f))
                  r4.addView(swingBox, lp(0, dp(48), 1f))
                  body.addView(r4)

                  val r5 = row()
                  r5.addView(key("TURBO\nSELF CLEAN", gray) { turbo() }, lp(0, dp(52), 1f))
                  r5.addView(key("LED /\nFOLLOW ME", gray) { led() }, lp(0, dp(52), 1f))
                  body.addView(r5)

                  val brand = TextView(this).apply {
                      text = "LLOYD"; textSize = 26f; setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#2B2B2B")); gravity = Gravity.CENTER
                      letterSpacing = 0.15f
                  }
                  body.addView(brand, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(18) })

                  root.addView(body)
                  setContentView(ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#161616"))
                      addView(root)
                  })
                  tvStatus.text = "Ready. Nothing sent yet."
                  render()
              }

              private fun render() {
                  if (on) {
                      tvMode.text = modeText[mode]
                      tvTemp.text = "$temp°c"
                      tvFan.text = "✢ " + fanText[fan]
                      lcd.alpha = 1f
                  } else {
                      tvMode.text = "OFF"
                      tvTemp.text = "--"
                      tvFan.text = ""
                      lcd.alpha = 0.55f
                  }
                  prefs.edit().putBoolean("on", on).putInt("temp", temp)
                      .putInt("mode", mode).putInt("fan", fan).apply()
              }

              private fun flash(msg: String) { tvStatus.text = msg }

              private fun needOn(): Boolean {
                  if (!on) flash("AC is off. Press ON/OFF first.")
                  return on
              }

              private fun buzz() {
                  try { vib.vibrate(VibrationEffect.createOneShot(30, VibrationEffect.DEFAULT_AMPLITUDE)) } catch (e: Exception) {}
              }

              private fun transmit(label: String, code: Int) {
                  buzz()
                  if (!ir.hasIrEmitter()) { flash("No IR blaster found on this phone"); render(); return }
                  val t = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                  try {
                      ir.transmit(38000, Coolix.pattern(code))
                  } catch (e: Exception) {
                      flash("Transmit failed: ${e.message}")
                      render()
                      return
                  }
                  tvStatus.text = "Sent: $label  ($t)\nListen for the AC beep"
                  log.add(0, "$t  $label")
                  if (log.size > 6) log.removeAt(log.size - 1)
                  tvLog.text = log.joinToString("\n")
                  tvTx.visibility = View.VISIBLE
                  tvTx.postDelayed({ tvTx.visibility = View.INVISIBLE }, 700)
                  render()
              }

              private fun stateCode() = Coolix.state(temp, Coolix.MODES[mode].second, Coolix.FANS[fan].second)

              private fun togglePower() {
                  if (on) { on = false; transmit("POWER OFF", Coolix.OFF) }
                  else { on = true; transmit("POWER ON ${temp}°C ${Coolix.MODES[mode].first}", stateCode()) }
              }

              private fun tempStep(d: Int) {
                  if (!needOn()) return
                  temp = (temp + d).coerceIn(17, 30)
                  transmit("TEMP ${temp}°C", stateCode())
              }

              private fun cycleMode() {
                  if (!needOn()) return
                  mode = (mode + 1) % 4
                  transmit("MODE ${Coolix.MODES[mode].first}", stateCode())
              }

              private fun cycleFan() {
                  if (!needOn()) return
                  fan = (fan + 1) % 4
                  transmit("FAN ${Coolix.FANS[fan].first}", stateCode())
              }

              private fun swing() { if (needOn()) transmit("SWING", Coolix.SWING) }
              private fun sleepMode() { if (needOn()) transmit("SLEEP", Coolix.SLEEP) }
              private fun turbo() { if (needOn()) transmit("TURBO", Coolix.TURBO) }
              private fun led() { transmit("DISPLAY LED", Coolix.LED) }
          }
          FILE_EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LloydAC.apk
          gh release create "build-${{ github.run_number }}" LloydAC.apk --title "Lloyd AC build ${{ github.run_number }}" --notes "Install LloydAC.apk"
